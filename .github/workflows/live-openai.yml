name: Live OpenAI (manual, paid)

# Paid checks against the real OpenAI API: key check, one judge call, one realtime transcription
# of synthetic `say` speech. Manual only, owner only, in the `openai-live` environment (restricted
# to main). Never runs on pull requests or forks; the key is never printed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    if: github.actor == github.repository_owner
    runs-on: macos-26
    timeout-minutes: 20
    environment: openai-live
    steps:
      - uses: actions/checkout@v4
      - name: Live tests
        working-directory: swift/Packages/ListenMoreKit
        env:
          LISTEN_MORE_LIVE: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Only test names and pass/fail lines are shown; the tests themselves print nothing else.
        run: |
          set -o pipefail
          swift test --filter ListenMoreLiveTests 2>&1 | grep -E "Test Case|Executed|error:|skipped"
