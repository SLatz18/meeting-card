name: Voice harness live (manual, paid)

# The voice harness in live mode on Linux: OpenAI TTS speaks both sides, then real realtime
# transcription and the judge run on it. Manual dispatch only, owner only, in the `openai-live`
# environment (restricted to main). Forks and other events never start it. The key is in the live
# step's environment only; the harness refuses it as an argument, never prints it, and scrubs every
# output file. Artifacts: the results table, results.json and the token/cost log (no audio).
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "One scenario name (blank runs all; see lm-harness --list)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: openai-live
    container: swift:6.2-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          swift --version
          apt-get update -q && apt-get install -y -q libssl-dev pkg-config ca-certificates
      - name: Build
        working-directory: swift/Packages/ListenMoreHarness
        run: swift build --product lm-harness
      - name: Live run
        working-directory: swift/Packages/ListenMoreHarness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          args=(--live --out "$GITHUB_WORKSPACE/harness-live")
          if [ -n "$SCENARIO" ]; then args+=(--scenario "$SCENARIO"); fi
          swift run --skip-build lm-harness "${args[@]}"
      - name: Results in the job summary
        if: always()
        run: cat "$GITHUB_WORKSPACE/harness-live/results.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-live-results
          path: |
            harness-live/results.md
            harness-live/results.json
            harness-live/cost-log.jsonl
          if-no-files-found: ignore
