name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Test + Release build (ad-hoc signed)
        working-directory: swift
        run: ./scripts/build.sh build
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: swift/build/*.log
