name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers
      - name: Install xcodegen
        run: brew install xcodegen
      # App tests, ListenMoreKit tests (swift test; live OpenAI tests skip without the opt-in), then
      # the Release build, ad-hoc signed. Nothing is installed.
      - name: Test (app + ListenMoreKit) + Release build (ad-hoc signed)
        working-directory: swift
        run: ./scripts/build.sh build
      - name: Default build keeps the shipping identity
        working-directory: swift
        run: |
          app=build/dd/Build/Products/Release/MeetingCardSwift.app
          for k in CFBundleIdentifier CFBundleDisplayName CFBundleName; do
            echo "$k=$(plutil -extract $k raw "$app/Contents/Info.plist")"
          done
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "com.slatz.meetingcard.swift"
          test "$(plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist")" = "MeetingCardSwift"
          test "$(plutil -extract CFBundleName raw "$app/Contents/Info.plist")" = "MeetingCardSwift"
          codesign -d --verbose=2 "$app" 2>&1 | grep -x "Identifier=com.slatz.meetingcard.swift"
      # The Mac hand checks' build (docs/MAC_DEMO_CHECKS.md); Kit tests already ran above.
      - name: Test-id build (build.sh build --test-id)
        working-directory: swift
        env:
          SKIP_KIT_TESTS: "1"
        run: ./scripts/build.sh build --test-id
      - name: Test-id build has the test identity
        working-directory: swift
        run: |
          app=build/dd-test/Build/Products/Release/MeetingCardSwift.app
          for k in CFBundleIdentifier CFBundleDisplayName CFBundleName; do
            echo "$k=$(plutil -extract $k raw "$app/Contents/Info.plist")"
          done
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "com.slatz.meetingcard.swift.test"
          test "$(plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist")" = "MeetingCard (Test)"
          test "$(plutil -extract CFBundleName raw "$app/Contents/Info.plist")" = "MeetingCard (Test)"
          codesign -d --verbose=2 "$app" 2>&1 | grep -x "Identifier=com.slatz.meetingcard.swift.test"
      # The coach's audio debug readout (App/CoachDebugReadout.swift) is compiled into the test build only.
      - name: Debug readout only in the test build
        working-directory: swift
        run: |
          shipping=build/dd/Build/Products/Release/MeetingCardSwift.app/Contents/MacOS/MeetingCardSwift
          testbuild=build/dd-test/Build/Products/Release/MeetingCardSwift.app/Contents/MacOS/MeetingCardSwift
          for marker in "MeetingCard audio debug readout" "CoachDebugReadout"; do
            in_shipping=$(strings -a "$shipping" | grep -c "$marker" || true)
            in_test=$(strings -a "$testbuild" | grep -c "$marker" || true)
            echo "$marker: shipping $in_shipping, test build $in_test"
            test "$in_shipping" -eq 0
            test "$in_test" -gt 0
          done
      - name: Kit test summary
        working-directory: swift
        run: grep -E "Executed [0-9]+ tests" build/kit-test.log | tail -1
      # Report-only: does ScreenCaptureKit honor sharingType .none for the glow and the coach card?
      - name: Screen-share probe (report only)
        working-directory: swift/Packages/ListenMoreKit
        continue-on-error: true
        env:
          LISTEN_MORE_SCK_PROBE: "1"
          LISTEN_MORE_SCK_PROBE_OUT: ${{ github.workspace }}/swift/build/sck-probe
        run: |
          sw_vers
          swift test --scratch-path ../../build/kit --filter ScreenShareProbeTests 2>&1 | tee ../../build/sck-probe.log
          grep SCK_PROBE_RESULT ../../build/sck-probe.log || echo "SCK_PROBE_RESULT none"
      - name: Package the .app (unsigned build artifact, not notarized)
        working-directory: swift/build/dd/Build/Products/Release
        run: ditto -c -k --keepParent MeetingCardSwift.app "$GITHUB_WORKSPACE/MeetingCardSwift-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingCardSwift-app
          path: MeetingCardSwift-app.zip
      - name: Package the test-id .app (for the Mac hand checks)
        run: |
          ditto swift/build/dd-test/Build/Products/Release/MeetingCardSwift.app "$RUNNER_TEMP/MeetingCardSwift-Test.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/MeetingCardSwift-Test.app" "$GITHUB_WORKSPACE/MeetingCardSwift-Test-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingCardSwift-Test-app
          path: MeetingCardSwift-Test-app.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sck-probe
          path: |
            swift/build/sck-probe/
            swift/build/sck-probe.log
          if-no-files-found: ignore
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: swift/build/*.log

  # Linux: ListenMoreCore's tests, then the offline voice harness (swift/Packages/ListenMoreHarness):
  # synthetic You/Them streams through the real CoachSession, deterministic, no secrets, no API calls.
  linux-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.2-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          swift --version
          apt-get update -q && apt-get install -y -q libssl-dev pkg-config
      - name: ListenMoreCore tests (Linux)
        working-directory: swift/Packages/ListenMoreKit
        run: |
          status=0
          swift test > "$RUNNER_TEMP/core-linux.log" 2>&1 || status=$?
          grep -E "error:|failed|Executed [0-9]+ tests" "$RUNNER_TEMP/core-linux.log" | tail -40 || true
          exit $status
      - name: Harness tests (offline)
        working-directory: swift/Packages/ListenMoreHarness
        run: |
          status=0
          swift test > "$RUNNER_TEMP/harness-tests.log" 2>&1 || status=$?
          grep -E "error:|failed|Executed [0-9]+ tests" "$RUNNER_TEMP/harness-tests.log" | tail -40 || true
          exit $status
      - name: Harness run (offline) and results table
        working-directory: swift/Packages/ListenMoreHarness
        run: swift run lm-harness --out "$GITHUB_WORKSPACE/harness-out"
      - name: Results in the job summary
        if: always()
        run: cat "$GITHUB_WORKSPACE/harness-out/results.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-offline-results
          path: harness-out/
          if-no-files-found: ignore

  # Reminder cards rendered at the base and head revisions must be pixel-identical; the coach UI
  # (chip states, glow, Settings, onboarding, the coach card and pill) is rendered from head for review.
  snapshots:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
      - name: Tools
        run: |
          sw_vers
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
      - name: Release builds (base and head; no tests, nothing installed)
        run: |
          for rev in base head; do
            (cd "$rev/swift" && xcodegen generate --quiet && xcodebuild -project MeetingCardSwift.xcodeproj \
              -scheme MeetingCardSwift -configuration Release -derivedDataPath build/dd build >"$RUNNER_TEMP/build-$rev.log" 2>&1) \
              || { grep -E "error:" "$RUNNER_TEMP/build-$rev.log" | head -40; exit 1; }
          done
      - name: Default Info.plist vs base (report only)
        continue-on-error: true
        run: |
          p=swift/build/dd/Build/Products/Release/MeetingCardSwift.app/Contents/Info.plist
          if cmp "base/$p" "head/$p"; then
            echo "Default Info.plist: byte-identical to base" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Default Info.plist: differs from base" | tee -a "$GITHUB_STEP_SUMMARY"
            diff <(plutil -p "base/$p") <(plutil -p "head/$p") || true
            exit 1
          fi
      - name: Render reminder cards (base vs head)
        run: head/swift/scripts/snapshots.sh cards base/swift head/swift "$RUNNER_TEMP/shots/cards"
      - name: Render coach UI (head)
        run: head/swift/scripts/snapshots.sh coach "$RUNNER_TEMP/shots/coach"
      # Report only: coach shots base vs head, in the job summary.
      - name: Render coach UI (base)
        if: github.event_name == 'pull_request'
        run: base/swift/scripts/snapshots.sh coach "$RUNNER_TEMP/shots/coach-base" || echo "base coach render failed (report only)"
      - name: Coach UI vs base (report only)
        if: github.event_name == 'pull_request'
        run: |
          out="$RUNNER_TEMP/shots/coach-vs-base"
          for rev in base head; do
            src="$RUNNER_TEMP/shots/coach"; [[ "$rev" == base ]] && src="$RUNNER_TEMP/shots/coach-base"
            mkdir -p "$out/$rev"
            [[ -d "$src" ]] || continue
            # coach-chip, glow and packet shots are excluded: they contain the reminder card, whose clock changes between the base and head renders.
            find "$src" -maxdepth 1 -type f -name '*.png' ! -name 'coach-chip-*' ! -name 'glow-*' ! -name 'packet-*' \
              -exec cp {} "$out/$rev/" \;
          done
          "$RUNNER_TEMP/venv/bin/python" head/swift/scripts/compare-snapshots.py "$out/base" "$out/head" "$out/compare" || true
          { echo "### Coach UI vs base (report only)"; cat "$out/compare/report.md"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Reminder cards are pixel-identical
        run: |
          rc=0
          "$RUNNER_TEMP/venv/bin/python" head/swift/scripts/compare-snapshots.py \
            "$RUNNER_TEMP/shots/cards/base" "$RUNNER_TEMP/shots/cards/head" "$RUNNER_TEMP/shots/compare" 12 || rc=$?
          cat "$RUNNER_TEMP/shots/compare/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: ${{ runner.temp }}/shots/
      # The coach card and pill in each state (light and dark), and the morph and collapse end states.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coach-card-snapshots
          path: |
            ${{ runner.temp }}/shots/coach/coach-card-*.png
            ${{ runner.temp }}/shots/coach/coach-pill-*.png
            ${{ runner.temp }}/shots/coach/coach-morph-end-*.png
            ${{ runner.temp }}/shots/coach/coach-collapse-end-*.png
            ${{ runner.temp }}/shots/coach/coach-card-shots.log
          if-no-files-found: error
