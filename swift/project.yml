# xcodegen spec. The generated MeetingCardSwift.xcodeproj is NOT committed (CTO ruling Q1);
# scripts/build.sh regenerates it. Settings are explicit: the installed xcodegen ships
# without its SettingPresets directory (CTO ruling Q2).
name: MeetingCardSwift
options:
  bundleIdPrefix: com.slatz.meetingcard
  deploymentTarget: {macOS: "15.0"}
settings:
  base:
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    CLANG_ENABLE_MODULES: YES
    COMBINE_HIDPI_IMAGES: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      ONLY_ACTIVE_ARCH: NO
      DEBUG_INFORMATION_FORMAT: dwarf
      STRIP_INSTALLED_PRODUCT: YES
# The call coach (its single source; see Packages/ListenMoreKit/README.md).
packages:
  ListenMoreKit:
    path: Packages/ListenMoreKit
targets:
  # Foundation-only logic shared by the app, the tests, and a future WidgetKit extension.
  MeetingCardCore:
    type: framework
    platform: macOS
    sources:
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slatz.meetingcard.swift.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        INSTALL_PATH: "@rpath"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../Frameworks"
  MeetingCardSwift:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - {target: MeetingCardCore, embed: true}
      - {package: ListenMoreKit, product: ListenMoreCore}
      - {package: ListenMoreKit, product: ListenMoreMac}
    settings:
      base:
        # scripts/build.sh --test-id overrides these two: com.slatz.meetingcard.swift.test, "MeetingCard (Test)".
        MEETINGCARD_APP_ID: com.slatz.meetingcard.swift
        MEETINGCARD_APP_NAME: MeetingCardSwift
        PRODUCT_BUNDLE_IDENTIFIER: "$(MEETINGCARD_APP_ID)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleName: "$(MEETINGCARD_APP_NAME)"
        CFBundleDisplayName: "$(MEETINGCARD_APP_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        # Call coach (opt-in, off by default): mic, and system audio of the call app.
        NSMicrophoneUsageDescription: "MeetingCard uses your mic during calls so Call coach can notice interruptions and missed questions. Nothing is recorded or saved."
        NSAudioCaptureUsageDescription: "MeetingCard needs system audio so Call coach can hear the other people on your call. Nothing is recorded or saved."
        # "Use Zoom/Meet controls" (opt-in, off by default): asks Chrome and Dia whether a Meet tab is open.
        NSAppleEventsUsageDescription: "With Use Zoom/Meet controls on, MeetingCard asks your browser only whether a Google Meet call tab is open, so Call coach can stop when you leave. It never reads page titles or other tabs."
  # Hostless: an app-hosted bundle fought the app's run loop in the phase-1 probe.
  MeetingCardCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [{path: Tests, excludes: ["Fixtures/**"]}]
    dependencies: [{target: MeetingCardCore}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slatz.meetingcard.swift.tests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../Frameworks"
schemes:
  MeetingCardSwift:
    build: {targets: {MeetingCardSwift: all, MeetingCardCoreTests: [test]}}
    test: {targets: [MeetingCardCoreTests]}
